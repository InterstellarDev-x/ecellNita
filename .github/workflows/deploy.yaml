name: Deploy to Production

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: 22
          command_timeout: 30m

          script: |
            set -e

            cd /home/azureuser/ecellNita
            git pull --ff-only origin master

            cd backend
            npm ci --omit=dev

            cd ../frontend
            npm ci

            grep -q '^VITE_BASE_URL=https://' .env.production || {
              echo "Production API URL is missing"
              exit 1
            }

            npm run build

            if grep -RFl "localhost:4000" dist/assets >/dev/null; then
              echo "Frontend contains localhost API URL"
              exit 1
            fi

            sudo rsync -a --delete dist/ /var/www/recycool/
            sudo chown -R www-data:www-data /var/www/recycool

            cd ..
            pm2 startOrRestart \
              ecosystem.config.js \
              --only backend \
              --update-env

            pm2 save

            curl --fail \
              --retry 10 \
              --retry-delay 2 \
              --retry-connrefused \
              https://api.recycool.ecellnita.in/health

            curl --fail \
              https://recycool.ecellnita.in \
              >/dev/null

            echo "Deployment completed successfully"